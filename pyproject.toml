[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "foundry-eng-conformance"
version = "0.1.1"
description = "Foundry-Studio eng-conformance tool — implements JOS-S53 checks (structure-coverage + dependency-direction/acyclic) against a per-repo .foundry/eng-manifest.yaml."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Foundry Studio", email = "tim@foundry-studio.com" }]
keywords = ["architecture-conformance", "dependency-checking", "monorepo", "import-linter", "jos-s53"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pyyaml>=6.0,<7.0",
    "pydantic>=2.0,<3.0",
    "click>=8.1,<9.0",
    "import-linter>=2.0,<3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4,<9.0",
    "pytest-cov>=4.1,<6.0",
]

[project.scripts]
foundry-eng-conformance = "foundry_eng_conformance.cli:main"

[project.urls]
Homepage = "https://github.com/Foundry-Studio/foundry-eng-conformance"
Issues = "https://github.com/Foundry-Studio/foundry-eng-conformance/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
